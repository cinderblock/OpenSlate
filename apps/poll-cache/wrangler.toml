name = "openslate-poll-cache"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Deployed by Workers Builds on every push to master (see README "Deployment").
# The worker and its custom domains belong to github.com/cinderblock/ops
# (cloudflare/config/projects/openslate.yaml), so no routes here. The name must
# match the worker ops provisions.
#
# Production answers only at api.openslate.us, not at a workers.dev duplicate.
workers_dev = false
preview_urls = false

# Zone-level Tiered Cache would make the cache global rather than per
# datacenter; it is off, which is harmless at this traffic. See
# plans/polls-cache-worker.md.

# Workers Logs off: the worker relays opt-in address lookups
# (src/geocode.ts) and promises to keep nothing. The address travels in a
# POST body, which invocation logs wouldn't record anyway; this makes it
# explicit. Approved by the user 2026-10-20 (plans/find-my-districts.md).
[observability]
enabled = false

# Google Civic Information relay (src/civic.ts). Its key is the secret
# GOOGLE_CIVIC_API_KEY, set outside this repo (never commit it); without it
# the civic routes answer 501 and the web app doesn't offer them. Only pages
# from these origins (and localhost) get CORS headers on those routes.
[vars]
CIVIC_ALLOWED_ORIGINS = "https://openslate.us"
