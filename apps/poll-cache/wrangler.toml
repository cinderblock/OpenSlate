name = "openslate-poll-cache"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Deployed by Workers Builds on every push to master (see README "Deployment").
# The worker and its custom domain, polls.openslate.us, belong to
# github.com/cinderblock/ops (cloudflare/config/projects/openslate.yaml), so no
# routes here. The name must match the worker ops provisions.
#
# Production answers only at polls.openslate.us, not at a workers.dev duplicate.
workers_dev = false
preview_urls = false

# Zone-level Tiered Cache would make the cache global rather than per
# datacenter; it is off, which is harmless at this traffic. See
# plans/polls-cache-worker.md.
