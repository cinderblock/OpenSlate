<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light and dark from the first frame, so first load never flashes the
         wrong colour. theme.js applies a Settings → Appearance choice before
         anything paints; it must stay a plain blocking script (CSP allows no
         inline script). The style below repeats --bg and --text from
         src/styles.css, which can arrive later: test/theme.test.ts keeps them
         in step. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <script src="/theme.js"></script>
    <style>
      html {
        color-scheme: light;
        background: #f3f4f6;
        color: #1b1f24;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          color-scheme: dark;
          background: #0f1115;
          color: #e6e8ec;
        }
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        background: #0f1115;
        color: #e6e8ec;
      }
    </style>
    <title>OpenSlate</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- What link previews show (Facebook, iMessage, SMS and the rest). Their
         crawlers run no script and never see the part of a URL after the "#",
         so every link to the app gets this one card. The image must be a
         raster at an absolute URL: its source is scripts/og-image.html, and
         test/linkPreview.test.ts holds the size to the PNG. -->
    <meta
      name="description"
      content="See your ballot race by race, with where the organizations and people you trust agree and split. Every endorsement is signed, so you can check who said it."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenSlate" />
    <meta property="og:url" content="https://openslate.us/" />
    <meta property="og:title" content="OpenSlate: plan your vote from sources you trust" />
    <meta
      property="og:description"
      content="See your ballot race by race, with where the organizations and people you trust agree and split. Every endorsement is signed, so you can check who said it."
    />
    <meta property="og:image" content="https://openslate.us/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenSlate: plan your vote from sources you trust" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
