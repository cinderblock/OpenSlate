# The desktop app (apps/desktop): builds both editions for Windows, macOS and
# Linux, each on its own runner (Electrobun can't cross-build), and self-tests
# every build in a real window before keeping its installer.
#
# A desktop-v<version> tag, matching apps/desktop/package.json, also drafts a
# GitHub release with the installers and their checksums. Publishing the draft
# is left to a person.

name: desktop

on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/.env.desktop"
      - "apps/web/vite.config.ts"
      - "apps/web/scripts/snapshot-catalog.ts"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUN_VERSION: "1.4.2"

jobs:
  # One snapshot of the public catalog for every offline build, so all
  # platforms carry the same copy.
  snapshot:
    name: Catalog snapshot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version apps/desktop/package.json)
          if [ "${GITHUB_REF_NAME}" != "desktop-v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match apps/desktop/package.json version ${version}"
            exit 1
          fi
      - name: Take the snapshot
        working-directory: apps/web
        run: bun run snapshot --out "${{ runner.temp }}/catalog-snapshot"
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-snapshot
          path: ${{ runner.temp }}/catalog-snapshot
          if-no-files-found: error

  build:
    name: ${{ matrix.os }} ${{ matrix.flavor }}
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-14, ubuntu-24.04]
        flavor: [standard, offline]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Linux libraries to run the app (for the self-test)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 xvfb

      - uses: actions/download-artifact@v8
        if: matrix.flavor == 'offline'
        with:
          name: catalog-snapshot
          path: ${{ runner.temp }}/catalog-snapshot

      - name: Build
        working-directory: apps/desktop
        shell: bash
        run: |
          args=(--flavor "${{ matrix.flavor }}")
          if [ "${{ matrix.flavor }}" = offline ]; then
            args+=(--snapshot "${{ runner.temp }}/catalog-snapshot")
          fi
          bun scripts/build.ts "${args[@]}"

      - name: Self-test
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            xvfb-run -a bun scripts/selftest.ts --flavor "${{ matrix.flavor }}"
          else
            bun scripts/selftest.ts --flavor "${{ matrix.flavor }}"
          fi

      - name: Name the installer for the release
        working-directory: apps/desktop
        run: bun scripts/collect.ts

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.flavor }}
          path: apps/desktop/release/*
          if-no-files-found: error

  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release create "${GITHUB_REF_NAME}" release/* \
            --draft \
            --title "OpenSlate desktop ${version}" \
            --notes-file apps/desktop/RELEASE_NOTES.md
